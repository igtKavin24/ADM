# Render Blueprint: New + > Blueprint > select this repo.
services:
  # Flask API
  - type: web
    name: adm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn backend.app:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3   # numpy 1.26.4 has no wheels for Python 3.13+

  # Frontend (static); forwards /api/* to the API service above
  - type: web
    name: adm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://adm-api.onrender.com/api/*
